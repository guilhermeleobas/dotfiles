[workspace]
authors = ["Guilherme Leobas <guilhermeleobas@gmail.com>"]
channels = ["conda-forge"]
name = "cpython"
platforms = ["osx-arm64", "linux-64"]
version = "0.1.0"

[tasks]

[activation.env]
PYTHONBREAKPOINT="pdbp.set_trace"
BUILD_CAFFE2="0"
BUILD_CAFFE2_OPS="0"
BUILD_TEST="0"
USE_DISTRIBUTED="0"
USE_CUDNN="0"
USE_FBGEMM="0"
USE_FLASH_ATTENTION="0"
USE_KINETO="0"
USE_MEM_EFF_ATTENTION="0"
USE_MIOPEN="0"
USE_MKLDNN="0"
USE_MPI="0"
USE_NCCL="0"
USE_NNPACK="0"
USE_OPENMP="0"
USE_QNNPACK="0"
USE_XNNPACK="0"
USE_PYTORCH_QNNPACK="0"
USE_ITT="0"
BUILD_LAZY_TS_BACKEND="1"
CMAKE_BUILD_TYPE="Release"
MAX_JOBS="20"
CMAKE_CXX_STANDARD="20"
USE_CUDA="0"
# ccache tuning: survive ghstack branch switches (mtime-only diffs still hit)
CCACHE_SLOPPINESS="time_macros,include_file_mtime,include_file_ctime,pch_defines"
CCACHE_COMPILERCHECK="content"

[dependencies]
zlib = ">=1.3.1,<2"
zlib-ng = ">=2.2.5,<3"
bzip2 = ">=1.0.8,<2"
pdbpp = ">=0.11.7,<0.12"
python-build = ">=1.3.0,<2"
cmake = ">=3.28,<4"
pkg-config = ">=0.29.2,<0.30"
ccache = ">=4.13.6,<5"
six = ">=1.17.0,<2"
expecttest = ">=0.3.0,<0.4"
ninja = ">=1.13.2,<2"
mold = ">=2.40.4,<3"
scikit-build-core = ">=1.0.3,<2"
spin = ">=0.18,<0.19"
