[workspace]
authors = ["Guilherme Leobas <guilhermeleobas@gmail.com>"]
channels = ["conda-forge"]
name = "sglang"
platforms = ["linux-64"]
version = "0.1.0"

[dependencies]
python = "3.12.*"
