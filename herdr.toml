onboarding = false

[theme]
name = "gruvbox"
auto_switch = false

[keys]
focus_pane_left = ["prefix+h", "ctrl+alt+h"]
focus_pane_right = ["prefix+l", "ctrl+alt+l"]
focus_pane_up = ["prefix+k", "ctrl+alt+k"]
focus_pane_down = ["prefix+j", "ctrl+alt+j"]
navigate_workspace_up = ["up"]
navigate_workspace_down = ["down"]
switch_workspace = ["alt+1..9"]
focus_agent = ["prefix+alt+1..9"]
next_agent = ["ctrl+shift+n"]
previous_agent = ["ctrl+shift+p"]
previous_workspace = ["ctrl+shift+k"]
next_workspace = ["ctrl+shift+j"]
open_worktree = ["prefix+ctrl+o"]
remove_worktree = ["prefix+ctrl+d"]

[remote]
manage_ssh_config = true

[ui]
# "priority" = attention queue: blocked/done agents float to the top
agent_panel_sort = "priority"
# distinct glyphs per state instead of same-shape colored dots
status_indicators = "symbols"

[worktrees]
directory = "~/git/worktrees"

# herdr-file-viewer: git-aware read-only file viewer in a split (? for help)
[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer"
description = "open file viewer in split"

